[pytest]
pythonpath =
    backend/libs/obs_common/src
    backend/services/api-gateway
    backend/services/ingestion-service
    backend/services/trace-service
    backend/services/log-service
    backend/services/metrics-service
    backend/services/rca-service
    backend/services/query-service
    backend/services/order-service
    backend/services/payment-service
    backend/services/notification-service
testpaths = backend/services backend/tests
addopts = --import-mode=importlib -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    rabbitmq: needs a reachable RabbitMQ (RABBITMQ_URL); skipped otherwise
    compose: end-to-end test against a running docker compose stack (BASE_URL); skipped otherwise
